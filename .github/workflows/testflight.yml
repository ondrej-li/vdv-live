name: TestFlight

# Archives VdvLive, exports it and puts the build on TestFlight.
#
# A tag push uploads; a manual run uploads unless you untick the box, so a run
# can also just prove that signing works. The watch app and the widget extension
# ride inside the phone app, so one archive covers all three.
#
# The six repository secrets are documented in docs/TESTFLIGHT.md.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight after archiving
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APP_CONNECT_KEY_ID: ${{ secrets.APP_CONNECT_KEY_ID }}
  APP_CONNECT_ISSUER_ID: ${{ secrets.APP_CONNECT_ISSUER_ID }}
  SHOULD_UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}

jobs:
  testflight:
    name: Archive & upload
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the signing secrets exist
        env:
          APP_CONNECT_KEY_P8: ${{ secrets.APP_CONNECT_KEY_P8 }}
          BUILD_CERTIFICATE_P12: ${{ secrets.BUILD_CERTIFICATE_P12 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in APPLE_TEAM_ID APP_CONNECT_KEY_ID APP_CONNECT_ISSUER_ID \
                      APP_CONNECT_KEY_P8 BUILD_CERTIFICATE_P12 BUILD_CERTIFICATE_PASSWORD; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing - see docs/TESTFLIGHT.md"
            exit 1
          fi
          echo "all six signing secrets are present"

      - name: Write the App Store Connect key
        env:
          APP_CONNECT_KEY_P8: ${{ secrets.APP_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p private_keys
          printf '%s' "$APP_CONNECT_KEY_P8" | base64 --decode > "private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8"
          chmod 600 "private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8"

      - name: Install the distribution certificate
        env:
          BUILD_CERTIFICATE_P12: ${{ secrets.BUILD_CERTIFICATE_P12 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain=/tmp/vdvlive-signing.keychain-db
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$BUILD_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k "$keychain" -P "$BUILD_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f /tmp/certificate.p12

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild -project VdvLive.xcodeproj -scheme VdvLive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VdvLive.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "${APP_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_CONNECT_ISSUER_ID}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive

      - name: Check the archive is what the store expects
        run: |
          set -euo pipefail
          app="build/VdvLive.xcarchive/Products/Applications/VdvLive.app"
          plutil -extract CFBundleShortVersionString raw "$app/Info.plist"
          plutil -extract CFBundleVersion raw "$app/Info.plist"
          test -d "$app/PlugIns" || true
          ls "$app/Watch" 2>/dev/null || echo "no watch payload in this archive"
          ls "$app/PlugIns" 2>/dev/null || echo "no app extensions in this archive"

      - name: Export the ipa
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/VdvLive.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist Config/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "${APP_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_CONNECT_ISSUER_ID}"

      - name: Upload to TestFlight
        if: ${{ env.SHOULD_UPLOAD == 'true' }}
        run: |
          set -euo pipefail
          ipa=$(ls build/export/*.ipa)
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "${APP_CONNECT_KEY_ID}" \
            --apiIssuer "${APP_CONNECT_ISSUER_ID}" \
            --apiKeyPath "$PWD/private_keys"

      - name: Keep the ipa
        uses: actions/upload-artifact@v4
        with:
          name: VdvLive-ipa
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 14
