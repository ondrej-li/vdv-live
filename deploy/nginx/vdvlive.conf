# HTTP: everything goes to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name vdv.ondralinek.cz;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vdv.ondralinek.cz;

    root /var/www/vdvlive;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Managed by certbot; `certbot renew` reloads nginx after replacing them.
    ssl_certificate /etc/letsencrypt/live/vdv.ondralinek.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vdv.ondralinek.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Pages are never cached, so a deploy is visible at once. Their assets carry a
    # content hash in the URL, so they can be cached indefinitely.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
