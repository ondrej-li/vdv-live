<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VdvMap - live simulator mirror</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0b1020;
    color: #cfd6e4;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  main { text-align: center; padding: 24px; }
  img {
    width: min(420px, 92vw);
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    background: #000;
  }
  p { margin: 14px 0 0; opacity: 0.65; }
</style>
</head>
<body>
<main>
  <img id="screen" src="live.jpg" alt="Simulator screen">
  <p>live.jpg, refreshed once a second by <code>make live</code> · Ctrl-C in the terminal to stop</p>
</main>
<script>
  // The capture loop replaces live.jpg atomically; the query string defeats the
  // browser cache so every tick shows the newest frame.
  const screen = document.getElementById('screen');
  setInterval(function () {
    screen.src = 'live.jpg?t=' + Date.now();
  }, 1000);
</script>
</body>
</html>
